[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-analyzer"
version = "1.0.0"
description = "Speech emotion recognition from sound and words, offline on a laptop CPU"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs model weights or large data; skipped by the pre-commit hook",
]
filterwarnings = [
    "ignore:torch.ao.quantization is deprecated:DeprecationWarning",
    "ignore:.*symlinks.*:UserWarning",
]
